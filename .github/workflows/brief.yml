name: Scrolling morning brief
on:
  schedule:
    - cron: "0 6,18 * * *"
    - cron: "0 7,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only proceed at 08:00 or 20:00 Europe/Berlin
        id: gate
        run: |
          H=$(TZ=Europe/Berlin date +%H)
          if [ "$H" = "08" ] || [ "$H" = "20" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with: { python-version: "3.11" }
      - name: Build brief
        if: steps.gate.outputs.go == 'true'
        run: python3 run_brief.py
      - name: Commit feed.json and state.json
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "scrolling-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feed.json state.json
          git diff --cached --quiet || git commit -m "Brief $(date -u +%F)"
          git push
