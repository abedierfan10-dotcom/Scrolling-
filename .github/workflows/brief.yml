name: Scrolling morning brief
on:
  schedule:
    - cron: "0 6,18 * * *"
    - cron: "0 7,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build brief
        run: python3 run_brief.py
      - name: Commit feed.json and state.json
        run: |
          git config user.name "scrolling-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feed.json state.json
          git diff --cached --quiet || git commit -m "Brief $(date -u +%F\ %H:%M)"
          git push
